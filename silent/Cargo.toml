[package]
name = "silent"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "staticlib"]
doctest = false

[dependencies]
# When changing rev, also update flake.lock:
#   nix --extra-experimental-features 'nix-command flakes' flake update bwk
bwk-sp = { git = "https://github.com/pythcoiner/bwk.git", rev = "fed9d71f2bc1b7628350c12cc9757c4bb892c40c" }
bitcoin = "0.32"
cxx = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
dirs = "6.0"
thiserror = "2.0"
getrandom = "0.2"
ureq = { version = "3.3", default-features = false, features = ["gzip", "native-tls"] }

[dev-dependencies]
blindbitd = { git = "https://github.com/pythcoiner/blindbitd.git", features = ["electrum"] }
bwk-utils = { git = "https://github.com/pythcoiner/bwk.git", rev = "fed9d71f2bc1b7628350c12cc9757c4bb892c40c", features = ["test"] }
temp-dir = "0.1"

[build-dependencies]
cxx-build = "1.0"
